services:
  nginx:
    image: nginx
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    ports:
      - 80:80
      - 443:443

  next:
    build:
      context: .
      dockerfile: docker/next/Dockerfile
    container_name: next
    ports:
      - 3001:3000
    tty: true
    volumes:
      - type: bind
        source: ./front-next
        target: /usr/src/app
    command: ["npm","run","dev"]

  nuxt:
    build:
      context: .
      dockerfile: docker/nuxt/Dockerfile
    container_name: nuxt
    ports:
      - 3000:3000
    tty: true
    environment:
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./front:/app:cached
      - nuxt_node_modules:/app/node_modules
    command: sh -c '(npm ci || npm install) && npm run dev'
    # host.docker.internal がホストのアドレスに解決
    # nuxt コンテナからホストに設置した API とかにアクセスする必要があった？（記憶ないもしかしたら EC2 関連でリクエスト来れないと通せないパターンがあったのかもしれない）
    extra_hosts:
      - "host.docker.internal:host-gateway"


  go:
    container_name: go
    build:
      context: .
      dockerfile: docker/golang/Dockerfile
    tty: true
    ports:
      - 8080:8080
    env_file:
      - ./mysql/.dev.env
      - ./backend/golang/src/.env
    depends_on:
      - dev_db
    volumes:
      - ./backend/golang/src:/go/src
      - ./backend/golang/src/internal/images:/go/src/internal/images

  go-test:
    container_name: go-test
    build:
      context: .
      dockerfile: docker/golang/Dockerfile.test
    tty: true
    environment:
      - GO_ENV=test
    volumes:
      - ./backend/golang/src:/go/src
    command: sh -c "cd /go/src && go test ./... -v"
    depends_on:
      - dev_db


  dev_db:
    container_name: dev_db
    build:
      context: .
      dockerfile: docker/mysql/Dockerfile
    tty: true
    ports:
      - 3308:3306
    env_file:
      - ./mysql/.dev.env

    volumes:
      - type: volume
        source: mysql_dev_volume
        target: /var/lib/mysql
      - type: bind 
        source: ./mysql/init
        target: /docker-entrypoint-initdb.d

  db:
    container_name: db
    build:
      context: .
      dockerfile: docker/mysql/Dockerfile
    tty: true
    ports:
      - 3307:3306
    env_file:
      - ./mysql/.env
    volumes:
      - type: volume
        source: mysql_test_volume
        target: /var/lib/mysql
      - type: bind 
        source: ./mysql/init
        target: /docker-entrypoint-initdb.d

  swagger-editor:
    image: swaggerapi/swagger-editor
    container_name: "swagger-editor"
    ports: 
      - "8001:8080"

  swagger-ui:
    image: swaggerapi/swagger-ui
    container_name: "swagger-ui"
    ports:
      - "8002:8080"
    volumes:
      - ./api/openapi.yaml:/openapi.yaml
    environment:
      - SWAGGER_JSON=/openapi.yaml
    
  swagger-api:
    image: stoplight/prism:3
    container_name: "swagger-api"
    ports:
      - "8003:4010"
    command: mock -h 0.0.0.0 /openapi.yaml
    volumes:
      - ./api/openapi.yaml:/openapi.yaml

volumes:
  nuxt_node_modules:
  mysql_dev_volume:
    name: mysql_dev_volume
  mysql_test_volume:
    name: mysql_test_volume